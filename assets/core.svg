<text x="56.0" y="104.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" font-weight="400" fill="#52514e" text-anchor="start">CORE is the DCLM benchmark's score over 22 tasks, as nanochat computes it; higher is better.</text>
<text x="56.0" y="625.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="400" fill="#898781" text-anchor="start">Ping and the two GPT-2 models were measured on one harness in November 2026. The stock nanochat figure is the one its author</text>
<text x="56.0" y="645.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="400" fill="#898781" text-anchor="start">published for its base model, which is not public.</text>
